[package]
name = "nexora_vault"
version = "0.2.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10.3"
rand = "0.8.5"
clap = { version = "4.0", features = ["derive", "suggestions", "color"] }
ring = "0.17"
argon2 = { version = "0.5", features = ["std"] }
zeroize = { version = "1.7", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
